# Friend Availability App - Main Configuration
spring.application.name=Friend Availability App

spring.profiles.active=${RAILWAY_ENVIRONMENT:local}

# Server Configuration
server.port=${PORT:8080}

# Logging Configuration
logging.level.com.linkups=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Google JWT Configuration (for JWT-based sign-in)
google.client.id=${GOOGLE_CLIENT_ID:365813320754-oloiphk0uprcn5iiaonl6l63ncd7msig.apps.googleusercontent.com}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:himasha1977@gmail.com}
spring.mail.password=${SMTP_PASSWORD:brcviwozolzbuoup}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
