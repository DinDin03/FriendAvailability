# Test Profile Configuration - Isolated from main application

# Application name for test environment
spring.application.name=Linkups - Test

# Use H2 in-memory database for fast tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable unnecessary features during testing
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Test Logging Configuration (reduced noise)
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.testcontainers=INFO
logging.level.com.friendavailability=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.test=INFO

# Disable security auto-configuration for easier testing
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Disable OAuth2 for testing (we'll mock it)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Disable email sending during tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# Test-specific email settings
app.email.from-name=LinkUp Test Team
app.email.from-address=test@example.com
app.email.verification.base-url=http://localhost:8080
app.email.verification.expiry-hours=1

# Fast test execution settings
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.maximum-pool-size=2